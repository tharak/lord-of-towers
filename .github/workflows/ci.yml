name: CI and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: native
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --lib
      - name: Extended simulation
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo test --locked --lib -- --ignored
  web:
    name: Browser build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          cache-on-failure: true
      - run: bash scripts/build-web.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: xvfb-run --auto-servernum npm test
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'schedule'
    needs: [rust, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
  deployed-smoke:
    name: Published game smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.url }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployed-browser-diagnostics
          path: |
            test-results/
            playwright-report/
